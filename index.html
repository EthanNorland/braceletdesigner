<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World</title>
<meta name="description" content="A single-file creative HTML app.">
<style>
  :root {
    --bg: #0d0d0f;
    --fg: #f5f5f7;
    --accent: #f0a500;
    --panel: #16161a;
    --border: #242429;
    --muted: #8a8a93;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  main {
    text-align: center;
    padding: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    max-width: 480px;
    width: 90%;
  }
  h1 {
    margin: 0 0 12px 0;
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    margin: 0 0 24px 0;
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
  }
  .pulse-btn {
    background: var(--accent);
    color: #111;
    border: none;
    padding: 12px 24px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .pulse-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
  }
  .pulse-btn:active {
    transform: translateY(0);
  }
  #counter {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
    font-family: ui-monospace, monospace;
  }
  #chip {
    position: fixed;
    right: 14px;
    bottom: 12px;
    font: 11px ui-monospace, monospace;
    color: var(--muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  #chip:hover {
    color: var(--fg);
    background: rgba(255,255,255,0.05);
  }
</style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <p>Your single-file creative HTML app is live on GitHub Pages.</p>
    <button class="pulse-btn" id="pingBtn">Interact</button>
    <div id="counter">Interactions: 0</div>
  </main>

  <button id="chip" title="Check for updates">v00000-001 ↻</button>

  <script>
    "use strict";
    const APP = {
      name: "Hello World",
      id: "hello-world",
      version: "v00000-001"
    };

    let count = 0;
    const btn = document.getElementById("pingBtn");
    const counter = document.getElementById("counter");
    const chip = document.getElementById("chip");

    btn.addEventListener("click", () => {
      count++;
      counter.textContent = "Interactions: " + count;
      btn.style.transform = "scale(0.96)";
      setTimeout(() => btn.style.transform = "", 100);
    });

    chip.textContent = APP.version + " ↻";
    chip.addEventListener("click", () => {
      alert("App version: " + APP.version + "\nEverything is up to date.");
    });
  </script>
</body>
</html>
