<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0B0E14" />
    </radialGradient>
    <radialGradient id="silverGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#D1D7E0" />
      <stop offset="80%" stop-color="#8892A0" />
      <stop offset="100%" stop-color="#4B5563" />
    </radialGradient>
    <radialGradient id="sapphireGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#70A6FF" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <radialGradient id="lapisGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>
    <radialGradient id="quartzGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E2E8F0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.8" />
    </radialGradient>
    <radialGradient id="goldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#854D0E" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.6" />

  <!-- Bracelet Cord -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6,4" />

  <!-- Beads on the Ring (r = 145, center 256, 256) -->
  <!-- Top / Quadrants beads -->
  <circle cx="256" cy="111" r="22" fill="url(#quartzGrad)" filter="url(#glow)" />
  <circle cx="205" cy="118" r="18" fill="url(#lapisGrad)" />
  <circle cx="307" cy="118" r="18" fill="url(#lapisGrad)" />

  <circle cx="158" cy="142" r="19" fill="url(#silverGrad)" />
  <circle cx="354" cy="142" r="19" fill="url(#silverGrad)" />

  <circle cx="122" cy="184" r="20" fill="url(#quartzGrad)" />
  <circle cx="390" cy="184" r="20" fill="url(#quartzGrad)" />

  <circle cx="111" cy="235" r="18" fill="url(#goldGrad)" />
  <circle cx="401" cy="235" r="18" fill="url(#goldGrad)" />

  <circle cx="118" cy="287" r="19" fill="url(#lapisGrad)" />
  <circle cx="394" cy="287" r="19" fill="url(#lapisGrad)" />

  <circle cx="142" cy="334" r="19" fill="url(#silverGrad)" />
  <circle cx="370" cy="334" r="19" fill="url(#silverGrad)" />

  <circle cx="184" cy="370" r="21" fill="url(#quartzGrad)" />
  <circle cx="328" cy="370" r="21" fill="url(#quartzGrad)" />

  <!-- Central Focal Clasp / Bead (Bottom center, 256, 401) -->
  <g transform="translate(256, 396)">
    <!-- Endcaps -->
    <rect x="-38" y="-12" width="10" height="24" rx="3" fill="url(#silverGrad)" />
    <rect x="28" y="-12" width="10" height="24" rx="3" fill="url(#silverGrad)" />
    <!-- Focal Sphere -->
    <circle cx="0" cy="0" r="28" fill="url(#silverGrad)" />
    <!-- Evil Eye / Centerpiece Details -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1E293B" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#FFFFFF" opacity="0.9" />
    <circle cx="0" cy="0" r="6" fill="url(#sapphireGrad)" />
    <circle cx="-2" cy="-2" r="2" fill="#FFFFFF" />
  </g>
</svg>
